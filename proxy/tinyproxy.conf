Port 8888
Timeout 600
LogLevel Info
MaxClients 50

# Only Docker's private networks may use the proxy (the port is never published to the host).
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS tunnels only, to allow-listed hosts only.
ConnectPort 443
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes

DisableViaHeader Yes
